services:
  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      API_KEYS: ${API_KEYS:-}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-120}
      CACHE_DIR: /app/.cache
      VALENBISI_API_KEY: ${VALENBISI_API_KEY:-}
      VALENBISI_CONTRACT: ${VALENBISI_CONTRACT:-valence}
      VALENBISI_BIKES_AUTH: ${VALENBISI_BIKES_AUTH:-}
    volumes:
      - transit-cache:/app/.cache
    networks:
      - default

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8083}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default: {}
      proxy-net:
        aliases:
          - en-ruta-frontend

volumes:
  transit-cache:

networks:
  proxy-net:
    name: ${PROXY_NETWORK:-proxy-net}